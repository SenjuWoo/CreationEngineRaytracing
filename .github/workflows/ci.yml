name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skyrim:
    name: Build Skyrim (Release)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Resolve vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { $root = "C:\vcpkg" }
          if (-not (Test-Path (Join-Path $root "scripts/buildsystems/vcpkg.cmake"))) {
            throw "Could not locate vcpkg under $root"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (SkyrimFlat)
        run: cmake --preset SkyrimFlat

      - name: Build (Skyrim Release)
        run: cmake --build --preset "Skyrim Release"

  fallout4:
    name: Build Fallout 4 (Release)
    runs-on: windows-latest
    timeout-minutes: 150
    # FO4 src targets a CommonLibF4 API (RE::UI::IsMenuOpen, TEnumSet::set(bool,...))
    # that no published CommonLibF4 commit provides; needs a source port.
    # Keep it visible but non-blocking until then.
    continue-on-error: true
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Resolve vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { $root = "C:\vcpkg" }
          if (-not (Test-Path (Join-Path $root "scripts/buildsystems/vcpkg.cmake"))) {
            throw "Could not locate vcpkg under $root"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Fallout4)
        run: cmake --preset Fallout4

      - name: Build (Fallout 4 Release)
        run: cmake --build --preset "Fallout 4 Release"
